name: Monthly DART Update

on:
  schedule:
    # 매월 1일 09:17 KST (00:17 UTC)
    - cron: "17 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: samsung-dart-monthly
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate DART API secret
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then
            echo "::error::Repository secret DART_API_KEY is not configured."
            exit 1
          fi

      - name: Collect and analyze financial data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m src.collect --start-year 2010

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: monthly OpenDART update [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
